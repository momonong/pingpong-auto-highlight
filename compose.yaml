name: pingpong-auto-highlight

services:
  pingpong-highlight:
    build:
      context: .
    image: pingpong-auto-highlight:local
    gpus: all
    restart: unless-stopped
    init: true
    ports:
      - "${PINGPONG_PORT:-8000}:8000"
    environment:
      PINGPONG_DATA_DIR: /data
      PINGPONG_HOST: 0.0.0.0
      PINGPONG_PORT: 8000
      PINGPONG_PUBLIC_URL: "${PINGPONG_PUBLIC_URL:-http://localhost:8000}"
      PINGPONG_BOOTSTRAP_ADMIN_USERNAME: "${PINGPONG_BOOTSTRAP_ADMIN_USERNAME:-admin}"
      PINGPONG_BOOTSTRAP_ADMIN_PASSWORD: "${PINGPONG_BOOTSTRAP_ADMIN_PASSWORD:-}"
      PINGPONG_SESSION_TTL_SECONDS: "${PINGPONG_SESSION_TTL_SECONDS:-604800}"
      PINGPONG_SESSION_COOKIE_SECURE: "${PINGPONG_SESSION_COOKIE_SECURE:-false}"
      PINGPONG_UPLOAD_TOKEN: "${PINGPONG_UPLOAD_TOKEN:-}"
      PINGPONG_ENABLE_LEGACY_TOKEN_AUTH: "${PINGPONG_ENABLE_LEGACY_TOKEN_AUTH:-false}"
      PINGPONG_TRUSTED_PROXY_PROVIDER: "${PINGPONG_TRUSTED_PROXY_PROVIDER:-none}"
      PINGPONG_MAX_UPLOAD_BYTES: "${PINGPONG_MAX_UPLOAD_BYTES:-107374182400}"
      PINGPONG_MAX_CHUNK_BYTES: "${PINGPONG_MAX_CHUNK_BYTES:-33554432}"
      PINGPONG_VIDEO_SAMPLE_FPS: "${PINGPONG_VIDEO_SAMPLE_FPS:-8}"
      PINGPONG_ANALYSIS_FRAME_SIZE: "${PINGPONG_ANALYSIS_FRAME_SIZE:-320}"
      PINGPONG_AUDIO_SAMPLE_RATE: "${PINGPONG_AUDIO_SAMPLE_RATE:-16000}"
      PINGPONG_WORKERS: "${PINGPONG_WORKERS:-1}"
      PINGPONG_MIN_POINT_SCORE_RATIO: "${PINGPONG_MIN_POINT_SCORE_RATIO:-0.87}"
      PINGPONG_MAX_POINTS: "${PINGPONG_MAX_POINTS:-}"
      PINGPONG_MAX_HIGHLIGHTS: "${PINGPONG_MAX_HIGHLIGHTS:-}"
      PINGPONG_REEL_TARGET_SECONDS: "${PINGPONG_REEL_TARGET_SECONDS:-55}"
      PINGPONG_CLIP_PRE_ROLL_SECONDS: "${PINGPONG_CLIP_PRE_ROLL_SECONDS:-1.5}"
      PINGPONG_CLIP_POST_ROLL_SECONDS: "${PINGPONG_CLIP_POST_ROLL_SECONDS:-1.5}"
      PINGPONG_DOWNLOAD_MIN_FREE_BYTES: "${PINGPONG_DOWNLOAD_MIN_FREE_BYTES:-2147483648}"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    volumes:
      - type: bind
        source: "${PINGPONG_DATA_PATH:-./data}"
        target: /data
    stop_grace_period: 2m
