# Install only after the hostname, existing sites and video-delivery plan are approved.
# cloudflared runs on this host and is the sole trusted caller of this loopback listener.
server {
    listen 127.0.0.1:18087;
    server_name REPLACE_WITH_REVIEWED_HOSTNAME;
    # Edge terminates TLS; this private listener serves only the HTTPS tunnel ingress.
    set $hc_external_scheme https;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    set $hc_client_ip $remote_addr;
    # Replace with the installed bundle's absolute path.
    include /REPLACE_WITH_BUNDLE_PATH/deploy/nginx/highlightcraft.location.conf;
    # Existing routes on this hostname MUST be restored here before routing DNS to it.
    location / { return 404; }
}
