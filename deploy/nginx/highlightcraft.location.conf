# Include inside the EXISTING reviewed TLS server; keep all other locations.
# Define $hc_external_scheme and $hc_client_ip in that server (see deployment.md).
location = /pingpong-highlight {
    absolute_redirect off;
    return 308 /pingpong-highlight/$is_args$args;
}
location ^~ /pingpong-highlight/ {
    # Trailing / strips this prefix; app and Uvicorn root_path must match it.
    proxy_pass http://127.0.0.1:18084/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $hc_external_scheme;
    proxy_set_header X-Forwarded-For $hc_client_ip;
    proxy_set_header X-Real-IP $hc_client_ip;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Connection "";
    client_max_body_size 32m; # frontend 8 MiB; app default maximum PATCH 32 MiB
    client_body_timeout 300s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 900s; # synchronous full-preview preparation may take minutes
    send_timeout 300s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_next_upstream off; # never retry a write against a second app
    proxy_redirect off;
    add_header Cache-Control "private, no-store" always;
}
