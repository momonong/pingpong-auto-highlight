# Example only. Prefer adding the location include to the EXISTING HTTPS server.
server {
    listen 443 ssl;
    server_name REPLACE_WITH_REVIEWED_HOSTNAME;
    ssl_certificate /REPLACE_WITH_CERTIFICATE/fullchain.pem;
    ssl_certificate_key /REPLACE_WITH_CERTIFICATE/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $hc_external_scheme $scheme;
    set $hc_client_ip $remote_addr;
    include /REPLACE_WITH_BUNDLE_PATH/deploy/nginx/highlightcraft.location.conf;
    # Preserve existing locations unchanged; do not replace the entire server block.
}
