services:
  pingpong-highlight:
    ports: !override
      - "127.0.0.1:${PINGPONG_PORT:-8000}:8000"
    environment:
      PINGPONG_SESSION_COOKIE_SECURE: "true"
      PINGPONG_TRUSTED_PROXY_PROVIDER: "cloudflare"

  cloudflared:
    image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - info
      - --metrics
      - 0.0.0.0:2000
      - --url
      - http://pingpong-highlight:8000
    depends_on:
      pingpong-highlight:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 35s
    healthcheck:
      test:
        - CMD
        - cloudflared
        - tunnel
        - --metrics
        - 127.0.0.1:2000
        - ready
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
