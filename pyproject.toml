[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pingpong-auto-highlight"
version = "1.3.0"
description = "Local-first, resumable table-tennis point-reel editing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.125,<1",
    "gdown>=6.1,<7",
    "numpy>=2.3,<3",
    "qrcode>=8.2,<9",
    "uvicorn[standard]>=0.38,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.9,<3",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]

[dependency-groups]
train = [
    "torch",
    "torchaudio",
    "torchvision",
]

[project.scripts]
pingpong-highlight = "pingpong_highlight.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pingpong_highlight"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["：", "，", "（", "）"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
